<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="My Progress" />
  <title>🌸 My Progress</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body { font-family: Georgia, serif; background: linear-gradient(135deg,#fdf4f5,#fce8f0 50%,#f0e8fc); min-height: 100vh; padding: 16px; padding-bottom: 40px; }
    h1 { font-size: 22px; font-weight: 700; color: #2d2d2d; letter-spacing: -0.5px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header p { font-size: 12px; color: #b06080; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
    .tabs { display: flex; background: rgba(255,255,255,0.6); border-radius: 16px; padding: 4px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.8); }
    .tab { flex: 1; padding: 9px 0; border-radius: 12px; border: none; background: transparent; color: #999; font-family: Georgia,serif; font-size: 13px; cursor: pointer; text-transform: capitalize; }
    .tab.active { background: #fff; color: #d4547a; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card { background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8); margin-bottom: 10px; }
    .card-pink { background: #fff8fa; }
    .card-purple { background: #fef9ff; }
    .card-gradient { background: linear-gradient(135deg,#fce8f0,#f0e8fc); }
    .card-hero { background: linear-gradient(135deg,#f7a8c0,#d4547a); color: #fff; text-align: center; }
    .label { display: block; font-size: 11px; color: #b06080; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }
    .input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid #f0e0ea; background: #fdf9fb; font-size: 15px; font-family: Georgia,serif; color: #2d2d2d; outline: none; }
    .input:focus { border-color: #d4547a; }
    .btn { width: 100%; padding: 13px; border-radius: 14px; border: none; background: linear-gradient(135deg,#f7a8c0,#d4547a); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: Georgia,serif; margin-top: 14px; }
    .btn-sm { width: auto; padding: 8px 14px; border-radius: 10px; font-size: 12px; margin-top: 0; }
    .btn-outline { background: #f0e0ea; color: #d4547a; }
    .stat-label { font-size: 11px; color: #b06080; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .stat-val { font-size: 32px; font-weight: 700; color: #2d2d2d; line-height: 1; }
    .stat-sub { font-size: 12px; color: #999; margin-top: 2px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .progress-bar { background: #f0e0ea; border-radius: 999px; height: 10px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg,#f7a8c0,#d4547a); transition: width 0.6s; }
    .sub-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
    .sub-tab { padding: 7px 14px; border-radius: 20px; border: none; background: rgba(255,255,255,0.7); color: #999; font-family: Georgia,serif; font-size: 12px; cursor: pointer; white-space: nowrap; text-transform: capitalize; }
    .sub-tab.active { background: #d4547a; color: #fff; font-weight: 700; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f9eef4; }
    .row:last-child { border-bottom: none; }
    .check-row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid #f9eef4; cursor: pointer; }
    .check-row:last-child { border-bottom: none; }
    .checkbox { width: 26px; height: 26px; border-radius: 8px; border: 2px solid #e0d0d8; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
    .checkbox.checked { background: #d4547a; border-color: #d4547a; color: #fff; font-size: 14px; }
    .section-title { font-size: 11px; color: #b06080; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
    .cal-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
    .cal-val { font-size: 20px; font-weight: 700; }
    .cal-lbl { font-size: 11px; color: #888; margin-bottom: 2px; }
    .cal-unit { font-size: 10px; color: #bbb; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #2d2d2d; color: #fff; padding: 10px 20px; border-radius: 24px; font-size: 13px; z-index: 999; white-space: nowrap; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 998; display: flex; align-items: center; justify-content: center; }
    .modal { background: #fff; border-radius: 20px; padding: 24px 28px; text-align: center; max-width: 280px; margin: 0 16px; }
    .hidden { display: none; }
    select.input { appearance: none; -webkit-appearance: none; }
    .history-meta { font-size: 11px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #f9eef4; }
    .net-green { color: #54b47a; }
    .net-orange { color: #d4a054; }
    .net-red { color: #d45454; }
    .backup-bar { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    svg text { font-family: Georgia, serif; }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div id="modal-delete" class="modal-overlay hidden">
  <div class="modal">
    <div style="font-size:32px;margin-bottom:8px">🗑️</div>
    <div style="font-weight:700;margin-bottom:8px;color:#2d2d2d">Delete this entry?</div>
    <div style="color:#888;font-size:13px;margin-bottom:20px">This can't be undone.</div>
    <div style="display:flex;gap:10px">
      <button onclick="closeDeleteModal()" style="flex:1;padding:10px;border-radius:12px;border:1.5px solid #e0e0e0;background:#fff;cursor:pointer;font-family:Georgia,serif">Cancel</button>
      <button onclick="confirmDelete()" style="flex:1;padding:10px;border-radius:12px;border:none;background:#ff6b8a;color:#fff;cursor:pointer;font-family:Georgia,serif;font-weight:700">Delete</button>
    </div>
  </div>
</div>

<div class="header">
  <div style="font-size:28px">🌸</div>
  <h1>My Progress</h1>
  <p>Target: Mid-August 2026</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('dashboard')">Dashboard</button>
  <button class="tab" onclick="switchTab('log')">Log</button>
  <button class="tab" onclick="switchTab('history')">History</button>
</div>

<div id="tab-dashboard"></div>
<div id="tab-log" class="hidden"></div>
<div id="tab-history" class="hidden"></div>

<div class="card backup-bar" style="margin-top:4px">
  <span style="font-size:11px;color:#b06080;font-weight:700;flex:1">💾 BACKUP</span>
  <button class="btn btn-sm" onclick="exportData()">Export</button>
  <button class="btn btn-sm btn-outline" onclick="document.getElementById('file-input').click()">Restore</button>
  <input id="file-input" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)" />
</div>

<script>
const START_DATE = "2026-05-23";
const START_WEIGHT = 60.1;
const HEIGHT_CM = 159;
const GOAL_MIN = 60.1 - 12;
const GOAL_MAX = 60.1 - 8;
const RESTING = 1412;
const SUPPLEMENTS = [
  { key: "forslean_am", name: "New Forslean (before breakfast)", note: "1 cap · before eating" },
  { key: "forslean_pre", name: "New Forslean (before workout)", note: "1 extra cap · workout days only" },
  { key: "meriroto_am", name: "Meriroto (after breakfast)", note: "1 cap · after eating" },
  { key: "meriroto_pm", name: "Meriroto (after dinner)", note: "1 cap · after eating" },
];
const WORKOUTS = [
  { name: "Reformer Pilates", cal: 250 },
  { name: "Tempo Burn Reformer", cal: 300 },
  { name: "Total Body Pilates", cal: 270 },
  { name: "Trampoline", cal: 350 },
  { name: "HIIT Video (30min)", cal: 280 },
  { name: "Run (30min)", cal: 280 },
  { name: "Brisk Walk (40min)", cal: 180 },
  { name: "Custom", cal: 0 },
];

const DEFAULT = {
  weights: [{ id: "start", date: START_DATE, weight: START_WEIGHT, note: "Starting weight 🌸" }],
  daily: {
    "2026-05-23": {
      supplements: {},
      workouts: [
        { id: "w1", name: "Total Body Pilates (Reformer)", cal: 270 },
        { id: "w2", name: "Afternoon Run – Lumphini 5.1km", cal: 330 }
      ],
      foods: [
        { id: "f1", name: "Korean BBQ + rice + lettuce", cal: 700 },
        { id: "f2", name: "Coconut water matcha", cal: 90 },
        { id: "f3", name: "Watermelon slice", cal: 40 }
      ]
    }
  }
};

let data = JSON.parse(localStorage.getItem("kaow_v1") || "null") || JSON.parse(JSON.stringify(DEFAULT));
let currentTab = "dashboard";
let currentSubTab = "workout";
let currentDDate = today();
let deleteTarget = null;

function today() { return new Date().toISOString().split("T")[0]; }
function fmtDate(s) { return new Date(s + "T00:00:00").toLocaleDateString("en-US", { month:"short", day:"numeric" }); }
function daysBetween(d1, d2) { return Math.round((new Date(d2) - new Date(d1)) / 86400000); }
function bmi(w) { return (w / ((HEIGHT_CM/100)**2)).toFixed(1); }

function save() { localStorage.setItem("kaow_v1", JSON.stringify(data)); }

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function getDayData(date) {
  if (!data.daily[date]) data.daily[date] = { supplements: {}, workouts: [], foods: [] };
  return data.daily[date];
}

function weeklyRate() {
  const s = [...data.weights].sort((a,b) => new Date(a.date)-new Date(b.date));
  if (s.length < 2) return null;
  const days = daysBetween(s[0].date, s[s.length-1].date);
  if (!days) return null;
  return ((s[0].weight - s[s.length-1].weight) / days * 7).toFixed(2);
}

function projected() {
  const rate = parseFloat(weeklyRate());
  if (!rate || rate <= 0) return null;
  const s = [...data.weights].sort((a,b) => new Date(a.date)-new Date(b.date));
  const latest = s[s.length-1];
  const weeks = (latest.weight - GOAL_MIN) / rate;
  const d = new Date(latest.date + "T00:00:00");
  d.setDate(d.getDate() + Math.round(weeks * 7));
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" });
}

// ── RENDER ──
function render() {
  renderDashboard();
  renderLog();
  renderHistory();
}

function renderDashboard() {
  const sorted = [...data.weights].sort((a,b) => new Date(a.date)-new Date(b.date));
  const latest = sorted[sorted.length-1];
  const curW = latest ? latest.weight : START_WEIGHT;
  const lost = (START_WEIGHT - curW).toFixed(1);
  const pct = Math.min(100, Math.max(0, ((START_WEIGHT - curW) / (START_WEIGHT - GOAL_MIN)) * 100));
  const dLeft = daysBetween(today(), "2026-08-15");
  const rate = weeklyRate();
  const proj = projected();
  const toGo = Math.max(0, curW - GOAL_MIN).toFixed(1);

  // Chart
  const minW = Math.min(...sorted.map(e=>e.weight), GOAL_MIN) - 0.5;
  const maxW = Math.max(...sorted.map(e=>e.weight)) + 0.5;
  const cH=160, cW=300, pL=38, pR=20, pT=10, pB=30;
  const iW=cW-pL-pR, iH=cH-pT-pB;
  const xP = i => pL + (sorted.length===1 ? iW/2 : (i/(sorted.length-1))*iW);
  const yP = w => pT + ((maxW-w)/(maxW-minW))*iH;
  const linePath = sorted.map((e,i)=>`${i===0?"M":"L"}${xP(i)},${yP(e.weight)}`).join(" ");
  const areaPath = sorted.length > 0 ? `${linePath} L${xP(sorted.length-1)},${cH-pB} L${xP(0)},${cH-pB} Z` : "";
  const goalY = yP(GOAL_MIN);
  const gridLines = [0,0.25,0.5,0.75,1].map(r => {
    const y = pT + r*iH;
    const w = (maxW - r*(maxW-minW)).toFixed(1);
    return `<line x1="${pL}" y1="${y}" x2="${cW-pR}" y2="${y}" stroke="#f0e0ea" stroke-width="1"/>
            <text x="${pL-4}" y="${y+4}" font-size="9" fill="#ccc" text-anchor="end">${w}</text>`;
  }).join("");
  const goalLine = goalY >= pT && goalY <= cH-pB ? 
    `<line x1="${pL}" y1="${goalY}" x2="${cW-pR}" y2="${goalY}" stroke="#d4547a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
     <text x="${cW-pR+2}" y="${goalY+4}" font-size="8" fill="#d4547a" opacity="0.7">goal</text>` : "";
  const dots = sorted.map((e,i)=>`<circle cx="${xP(i)}" cy="${yP(e.weight)}" r="4" fill="#d4547a" stroke="#fff" stroke-width="2"/>`).join("");
  const xLabels = sorted.filter((_,i)=>sorted.length<=6||i%Math.ceil(sorted.length/5)===0||i===sorted.length-1)
    .map(e=>`<text x="${xP(sorted.indexOf(e))}" y="${cH-pB+14}" font-size="8" fill="#bbb" text-anchor="middle">${fmtDate(e.date)}</text>`).join("");

  document.getElementById("tab-dashboard").innerHTML = `
    <div class="grid2">
      <div class="card"><div class="stat-label">Current</div><div class="stat-val">${curW}</div><div class="stat-sub">kg</div></div>
      <div class="card card-pink"><div class="stat-label">Lost</div><div class="stat-val" style="color:${parseFloat(lost)>0?'#d4547a':'#ccc'}">${parseFloat(lost)>0?`-${lost}`:"0"}</div><div class="stat-sub">kg so far</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span class="stat-label" style="margin:0">Goal Progress</span>
        <span style="font-size:12px;color:#888">${pct.toFixed(0)}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px">
        <span style="font-size:11px;color:#bbb">Start: ${START_WEIGHT}kg</span>
        <span style="font-size:11px;color:#bbb">Goal: ${GOAL_MIN}–${GOAL_MAX}kg</span>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Weight Chart</div>
      <svg width="100%" viewBox="0 0 ${cW} ${cH}" style="overflow:visible">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f7a8c0" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#f7a8c0" stop-opacity="0"/>
        </linearGradient></defs>
        ${gridLines}${goalLine}
        ${sorted.length>1?`<path d="${areaPath}" fill="url(#ag)"/>`:""}
        ${sorted.length>1?`<path d="${linePath}" fill="none" stroke="#d4547a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`:""}
        ${dots}${xLabels}
      </svg>
      ${sorted.length<2?'<div style="text-align:center;color:#ccc;font-size:12px;margin-top:4px">Log more entries to see your trend ✨</div>':""}
    </div>
    <div class="grid2">
      <div class="card"><div class="stat-label">BMI</div><div style="font-size:24px;font-weight:700;color:#2d2d2d">${bmi(curW)}</div><div class="stat-sub">${parseFloat(bmi(curW))<25?"Normal":"Overweight"}</div></div>
      <div class="card card-pink"><div class="stat-label">Days Left</div><div style="font-size:24px;font-weight:700;color:#2d2d2d">${dLeft}</div><div class="stat-sub">until mid-Aug</div></div>
      <div class="card"><div class="stat-label">To Go</div><div style="font-size:24px;font-weight:700;color:#2d2d2d">${toGo}kg</div><div class="stat-sub">to reach goal</div></div>
      <div class="card card-purple"><div class="stat-label">Weekly Rate</div><div style="font-size:24px;font-weight:700;color:#2d2d2d">${rate?`${rate>0?"-":"+"}${Math.abs(rate)}`:"—"}</div><div class="stat-sub">kg/week avg</div></div>
    </div>
    ${proj?`<div class="card card-hero"><div style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:0.85;margin-bottom:4px">Projected Goal Date</div><div style="font-size:22px;font-weight:700">${proj}</div><div style="font-size:11px;opacity:0.8;margin-top:2px">based on your current rate</div></div>`:""}
  `;
}

function renderLog() {
  const dd = getDayData(currentDDate);
  const wBurn = dd.workouts.reduce((s,w)=>s+w.cal,0);
  const totalBurn = RESTING + wBurn;
  const totalEaten = dd.foods.reduce((s,f)=>s+f.cal,0);
  const net = totalEaten - totalBurn;
  const netClass = net < 0 ? "net-green" : net < 200 ? "net-orange" : "net-red";

  const workoutOptions = WORKOUTS.map(w=>`<option value="${w.name}">${w.name}${w.cal?` (~${w.cal} cal)`:""}</option>`).join("");
  const workoutList = dd.workouts.length > 0 ? `
    <div class="card card-purple" style="margin-top:0">
      <div class="section-title">Today's Workouts</div>
      ${dd.workouts.map(w=>`
        <div class="row">
          <div><div style="font-size:14px;color:#2d2d2d;font-weight:600">${w.name}</div><div style="font-size:12px;color:#b06080">~${w.cal} kcal</div></div>
          <button onclick="removeWorkout('${w.id}')" style="background:none;border:none;color:#ddd;font-size:16px;cursor:pointer">✕</button>
        </div>`).join("")}
      <div style="margin-top:8px;font-size:13px;font-weight:700;color:#7a54d4;text-align:right">Total: ${wBurn} kcal</div>
    </div>` : "";

  const foodList = dd.foods.length > 0 ? `
    <div class="card card-purple" style="margin-top:0">
      <div class="section-title">Today's Food</div>
      ${dd.foods.map(f=>`
        <div class="row">
          <div><div style="font-size:14px;color:#2d2d2d;font-weight:600">${f.name}</div><div style="font-size:12px;color:#d4547a">${f.cal} kcal</div></div>
          <button onclick="removeFood('${f.id}')" style="background:none;border:none;color:#ddd;font-size:16px;cursor:pointer">✕</button>
        </div>`).join("")}
      <div style="margin-top:8px;font-size:13px;font-weight:700;color:#d4547a;text-align:right">Total: ${totalEaten} kcal</div>
    </div>` : "";

  const supChecked = Object.values(dd.supplements).filter(Boolean).length;

  document.getElementById("tab-log").innerHTML = `
    <div class="card">
      <div class="section-title">Logging for</div>
      <div style="border:1.5px solid #f0e0ea;border-radius:12px;overflow:hidden">
        <input type="date" id="ddate-input" class="input" value="${currentDDate}" onchange="changeDDate(this.value)" style="border:none;background:#fdf9fb" />
      </div>
    </div>
    <div class="card card-gradient">
      <div class="section-title">Today's Calorie Balance</div>
      <div class="cal-grid">
        <div><div class="cal-lbl">Eaten</div><div class="cal-val" style="color:#d4547a">${totalEaten}</div><div class="cal-unit">kcal</div></div>
        <div><div class="cal-lbl">Burned</div><div class="cal-val" style="color:#7a54d4">${totalBurn}</div><div class="cal-unit">kcal</div></div>
        <div><div class="cal-lbl">Net</div><div class="cal-val ${netClass}">${net>0?`+${net}`:net}</div><div class="cal-unit">kcal</div></div>
      </div>
      <div style="margin-top:10px;font-size:11px;color:#999;text-align:center">Resting: ${RESTING} + Workout: ${wBurn} kcal burned</div>
    </div>
    <div class="sub-tabs">
      ${["workout","food","supplements","weight"].map(t=>`<button class="sub-tab${currentSubTab===t?" active":""}" onclick="switchSubTab('${t}')">${t}</button>`).join("")}
    </div>

    ${currentSubTab === "workout" ? `
      <div class="card">
        <div class="section-title">Add Workout</div>
        <label class="label">Class / Activity</label>
        <select id="workout-select" class="input" onchange="toggleCustomWorkout()">
          ${workoutOptions}
        </select>
        <div id="custom-workout-fields" style="display:none">
          <label class="label">Workout Name</label>
          <input id="custom-workout-name" class="input" placeholder="e.g. Yoga, Cycling..." />
          <label class="label">Calories Burned</label>
          <input id="custom-workout-cal" type="number" class="input" placeholder="e.g. 200" />
        </div>
        <button class="btn" onclick="addWorkout()">Add Workout 💪</button>
      </div>
      ${workoutList}
    ` : ""}

    ${currentSubTab === "food" ? `
      <div class="card">
        <div class="section-title">Log Food</div>
        <label class="label">Food / Meal</label>
        <input id="food-name" class="input" placeholder="e.g. Korean BBQ, Rice bowl..." />
        <label class="label">Calories (kcal)</label>
        <input id="food-cal" type="number" class="input" placeholder="e.g. 450" />
        <button class="btn" onclick="addFood()">Log Food 🍽️</button>
      </div>
      ${foodList}
    ` : ""}

    ${currentSubTab === "supplements" ? `
      <div class="card">
        <div class="section-title">Supplement Check-in</div>
        ${SUPPLEMENTS.map(s=>`
          <div class="check-row" onclick="toggleSup('${s.key}')">
            <div class="checkbox${dd.supplements[s.key]?" checked":""}">${dd.supplements[s.key]?"✓":""}</div>
            <div>
              <div style="font-size:15px;color:#2d2d2d;font-weight:${dd.supplements[s.key]?700:400}">${s.name}</div>
              <div style="font-size:11px;color:#bbb;margin-top:1px">${s.note}</div>
            </div>
          </div>`).join("")}
        <div style="margin-top:12px;font-size:12px;color:#bbb;text-align:center">${supChecked}/${SUPPLEMENTS.length} taken today</div>
      </div>
    ` : ""}

    ${currentSubTab === "weight" ? `
      <div class="card">
        <div class="section-title">Log Weight</div>
        <label class="label">Date</label>
        <div style="border:1.5px solid #f0e0ea;border-radius:12px;overflow:hidden">
          <input type="date" id="weight-date" class="input" value="${today()}" style="border:none;background:#fdf9fb" />
        </div>
        <label class="label">Weight (kg)</label>
        <input type="number" step="0.1" id="weight-val" class="input" placeholder="e.g. 59.5" />
        <label class="label">Note (optional)</label>
        <input id="weight-note" class="input" placeholder="e.g. feeling great..." />
        <button class="btn" onclick="addWeight()">Save Weight 🌸</button>
      </div>
      <div class="card card-purple">
        <div class="section-title">Weighing Tips</div>
        ${["⏰ Same time every day","🌅 Morning, after bathroom, before eating","📅 Weekly is better than daily","👗 Same clothing each time"].map(t=>`<div style="font-size:12px;color:#888;margin-bottom:6px;line-height:1.5">${t}</div>`).join("")}
      </div>
    ` : ""}
  `;
}

function renderHistory() {
  const sorted = [...data.weights].sort((a,b) => new Date(a.date)-new Date(b.date));
  const entries = sorted.slice().reverse();
  document.getElementById("tab-history").innerHTML = `
    <div style="font-size:11px;color:#b06080;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">Weight History (${data.weights.length})</div>
    ${entries.map(entry => {
      const prev = sorted[sorted.indexOf(entry)-1];
      const diff = prev ? (entry.weight - prev.weight).toFixed(1) : null;
      const isLoss = diff && parseFloat(diff) < 0;
      const isGain = diff && parseFloat(diff) > 0;
      const icon = isLoss ? "📉" : isGain ? "📈" : "📌";
      const iconBg = isLoss ? "#fff0f4" : isGain ? "#fff8f0" : "#f5f5f5";
      const dd = data.daily[entry.date] || {};
      const hasExtra = (dd.workouts?.length>0)||(dd.foods?.length>0)||Object.values(dd.supplements||{}).some(Boolean);
      return `
        <div class="card" style="margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:12px">
            <div style="width:44px;height:44px;border-radius:12px;background:${iconBg};display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${icon}</div>
            <div style="flex:1">
              <div style="display:flex;justify-content:space-between;align-items:baseline">
                <span style="font-weight:700;font-size:16px;color:#2d2d2d">${entry.weight} kg</span>
                ${diff?`<span style="font-size:12px;font-weight:700;color:${isLoss?"#d4547a":"#f0a060"}">${isLoss?"":"+"}${diff} kg</span>`:""}
              </div>
              <div style="font-size:12px;color:#bbb;margin-top:1px">${fmtDate(entry.date)}</div>
              ${entry.note?`<div style="font-size:11px;color:#aaa;margin-top:2px">${entry.note}</div>`:""}
            </div>
            ${entry.id!=="start"?`<button onclick="openDeleteModal('${entry.id}')" style="background:none;border:none;color:#ddd;font-size:16px;cursor:pointer">✕</button>`:""}
          </div>
          ${hasExtra?`<div class="history-meta">
            ${dd.workouts?.length>0?`<div style="font-size:11px;color:#7a54d4;margin-bottom:3px">💪 ${dd.workouts.map(w=>w.name).join(", ")}</div>`:""}
            ${dd.foods?.length>0?`<div style="font-size:11px;color:#d4547a;margin-bottom:3px">🍽️ ${dd.foods.reduce((s,f)=>s+f.cal,0)} kcal eaten</div>`:""}
            ${Object.values(dd.supplements||{}).some(Boolean)?`<div style="font-size:11px;color:#54a0d4">💊 ${Object.entries(dd.supplements).filter(([,v])=>v).map(([k])=>SUPPLEMENTS.find(s=>s.key===k)?.name||k).join(", ")}</div>`:""}
          </div>`:""}
        </div>`;
    }).join("")}
  `;
}

// ── ACTIONS ──
function switchTab(t) {
  currentTab = t;
  document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
  document.querySelectorAll("[id^='tab-']").forEach(el => el.classList.add("hidden"));
  event.target.classList.add("active");
  document.getElementById(`tab-${t}`).classList.remove("hidden");
  render();
}

function switchSubTab(t) {
  currentSubTab = t;
  renderLog();
}

function changeDDate(v) {
  currentDDate = v;
  renderLog();
}

function toggleCustomWorkout() {
  const sel = document.getElementById("workout-select");
  const fields = document.getElementById("custom-workout-fields");
  if (sel) fields.style.display = sel.value === "Custom" ? "block" : "none";
}

function addWorkout() {
  const sel = document.getElementById("workout-select");
  if (!sel) return;
  const isCustom = sel.value === "Custom";
  const preset = WORKOUTS.find(w => w.name === sel.value);
  const name = isCustom ? (document.getElementById("custom-workout-name")?.value || "Custom workout") : sel.value;
  const cal = isCustom ? (parseInt(document.getElementById("custom-workout-cal")?.value) || 0) : preset.cal;
  const dd = getDayData(currentDDate);
  dd.workouts.push({ id: Date.now().toString(), name, cal });
  save(); renderLog(); showToast("Workout added! 💪");
}

function removeWorkout(id) {
  const dd = getDayData(currentDDate);
  dd.workouts = dd.workouts.filter(w => w.id !== id);
  save(); renderLog();
}

function addFood() {
  const name = document.getElementById("food-name")?.value;
  const cal = parseInt(document.getElementById("food-cal")?.value);
  if (!name || isNaN(cal)) { showToast("Enter food name and calories"); return; }
  const dd = getDayData(currentDDate);
  dd.foods.push({ id: Date.now().toString(), name, cal });
  save(); renderLog(); showToast("Food logged! 🍽️");
}

function removeFood(id) {
  const dd = getDayData(currentDDate);
  dd.foods = dd.foods.filter(f => f.id !== id);
  save(); renderLog();
}

function toggleSup(key) {
  const dd = getDayData(currentDDate);
  dd.supplements[key] = !dd.supplements[key];
  save(); renderLog();
}

function addWeight() {
  const val = parseFloat(document.getElementById("weight-val")?.value);
  const date = document.getElementById("weight-date")?.value;
  const note = document.getElementById("weight-note")?.value || "";
  if (!val || isNaN(val)) { showToast("Enter a valid weight"); return; }
  data.weights.push({ id: Date.now().toString(), date, weight: parseFloat(val.toFixed(1)), note });
  data.weights.sort((a,b) => new Date(a.date)-new Date(b.date));
  save(); render(); showToast("Weight saved! 🌸");
}

function openDeleteModal(id) { deleteTarget = id; document.getElementById("modal-delete").classList.remove("hidden"); }
function closeDeleteModal() { deleteTarget = null; document.getElementById("modal-delete").classList.add("hidden"); }
function confirmDelete() {
  if (!deleteTarget) return;
  data.weights = data.weights.filter(e => e.id !== deleteTarget);
  save(); closeDeleteModal(); render(); showToast("Deleted");
}

function exportData() {
  const json = JSON.stringify(data);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "progress-backup.json";
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  showToast("Backup saved! 💾");
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      if (parsed && Array.isArray(parsed.weights)) {
        data = { weights: parsed.weights, daily: parsed.daily || {} };
        save(); render(); showToast("Data restored! 🌸");
      } else { showToast("Invalid backup file"); }
    } catch { showToast("Could not read file"); }
  };
  reader.readAsText(file);
  e.target.value = "";
}

render();
</script>
</body>
</html>
